# Genesis workshop CI — guards the product in templates/.
#
# Two rules, both live:
#   1. No placeholder syntax outside templates/ — root files are real, always.
#      Exemptions: templates/ is the placeholder carrier by design;
#      docs/architecture/adr and CHANGELOG.md are history that quotes the
#      syntax; GENESIS.md is the protocol that instructs about it.
#   2. A change inside templates/ is a product change: it must ship with a
#      CHANGELOG.md entry (the version's single source).

name: ci

on: [push, pull_request]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No placeholders outside templates/
        run: |
          ! git grep -nE '(^|[^$])[{][{]|GENESIS[:]FILL' -- . ':!templates' ':!docs/architecture/adr' ':!CHANGELOG.md' ':!GENESIS.md'

      - name: templates/ change ships with a CHANGELOG entry
        run: |
          base='${{ github.event.pull_request.base.sha || github.event.before }}'
          case "$base" in ''|0000000000000000000000000000000000000000) exit 0 ;; esac
          changed=$(git diff --name-only "$base"..HEAD)
          if echo "$changed" | grep -q '^templates/' && ! echo "$changed" | grep -qx 'CHANGELOG\.md'; then
            echo 'templates/ changed but CHANGELOG.md did not — bump the product version.'
            exit 1
          fi
